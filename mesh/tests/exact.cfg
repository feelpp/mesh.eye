directory = qs_laplacian/eye-exact


ksp-monitor=1
ksp-rtol=1e-13
pc-type=gamg

[gmsh]
filename=$cfgdir/../Eye_Mesh3D.msh
# # filename


[checker]
check=true
solution=x:x
filename=$cfgdir/checker.json
script=$cfgdir/laplacian.py

[checker.tolerance]
exact=1e-5


[functions]
g=x:x
f=0
a=1
b=3
c=2
# mu: diffusion term (laplacian) <1> (called k in the application)
mu=1
# gamma: reaction term (adr) <2>
gamma=0
# sigma: diffusion term (adr) <3>
sigma={1,0,0,0,1,0,0,0,1}
# beta: advection term (adr) <4>
beta={0,0,0}

[sc]
condense=true
pc-factor-mumps.icntl-24=1

[exporter]
format=ensightgold
geometry=static



